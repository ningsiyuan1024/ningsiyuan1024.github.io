<p>1. 美国当前债务供应远超需求，同时债务服务成本（利息与本金）相对收入快速上升，正挤压政府其他支出，与历史模式高度一致。</p><p>2. 美国国债规模约32万亿美元，2026年净新增发行预计达2.1万亿，短期债务占比异常高，外国持有者（尤其是中国、日本）购买意愿减弱，转向国内买家，加大长期债券需求压力和滚动风险。</p><p>3. 2027-2028年国债、企业债及股权（AI驱动）供应将大幅增加，可能推高利率、收紧信贷，并引发市场波动，最终不利于债务资产持有者。</p><p><a href="https://twitter.com/RayDalio/status/2110078299145695277" rel="noopener noreferrer">https://twitter.com/RayDalio/status/2110078299145695277</a></p>
