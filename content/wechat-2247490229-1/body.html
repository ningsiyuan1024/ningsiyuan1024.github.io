<figure><img src="/articles/wechat-2247490229-1/assets/f7bab969a6faec4736377425.webp" alt="" loading="lazy"></figure><div><h1>不要再用Token消耗衡量AI生产力了好不好</h1><p>相信企业内部做token消耗排行榜这种事大家不是第一次听到了。<br><br>想想真的匪夷所思，token消耗是纯粹的成本，怎么能用一个成本指标衡量AI生产力？<br><br>在最近的百度开发者大会上，李彦宏提出了DAA（Daily Active Agents），作为智能体时代的生产力指标。 <br><br>即关注有多少Agents在运作并交付结果，而非用无谓的token消耗做排行榜。<br><br>就很简单的一个指标，但很清晰，真的很难想象过去2年都没有人去强调这一点。<br><br>当然，我是物理学出身，当一个领域的基础指标都混乱不清，也预示着行业内部蕴含的巨大机遇。</p><div></div> </div>
