<p>Claude工程主管Felix Rieseberg撰文讲解如何更有野心（more ambitious）地使用AI，最终版的提示词总结如下，但具体讲解还是希望去阅读原文！</p><p>「我想要这个任务的更深入版本，而非更大版本。在重写它之前：<br>（1）说出此领域顶尖专业人士会做而我未要求的事情；<br>（2）指出他们会从哪些最原始素材开始，而不是那些已经为我消化处理过的内容；<br>（3）列举他们将使用的具体方法和工具；<br>（4）说明除了你或我，还有什么能证明结果是正确的。然后根据这些重写我的提示，以精确要求这些内容。」</p><p><a href="https://felixrieseberg.com/how-to-be-more-ambitious-a-tutorial-for-humans-with-models/" rel="noopener noreferrer">https://t.co/Xi36jtkGrF</a></p>
