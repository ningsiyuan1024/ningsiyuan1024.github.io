<p>李彦宏提出了DAA（Daily Active Agents）作为智能体时代的生产力指标。  </p><p>关注有多少Agents在运作并交付结果，而非用无谓的token消耗做排行榜。</p><p>想想真的匪夷所思，token消耗是成本，用一个成本指标衡量AI生产力，这种荒谬的事情竟然在过去2年成为了主流，足以证明当前的混乱和潜藏的机遇。 <a href="https://t.co/ALyW5sUIuz" rel="noopener noreferrer">https://t.co/ALyW5sUIuz</a></p><img src="/articles/x-2057704396721697254/assets/91f9413d0f78f092dfa25b62.jpg" alt="" loading="lazy">
